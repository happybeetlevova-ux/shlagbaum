name: Собрать APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.14.3' }
      - name: Достать ключ подписи из секретов
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Не заданы секреты KEYSTORE_B64 и KEYSTORE_PASS (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.jks
      - run: gradle :app:assembleRelease
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - run: cp app/build/outputs/apk/release/app-release.apk Shlagbaum.apk
      - uses: actions/upload-artifact@v5
        with: { name: Shlagbaum-apk, path: Shlagbaum.apk }
      - name: Опубликовать релиз
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Shlagbaum.apk \
            --target "${{ github.sha }}" \
            --title "Шлагбаум — последняя версия" \
            --notes "Скачайте Shlagbaum.apk на телефон и установите."
